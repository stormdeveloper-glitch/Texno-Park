<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <title>TP Boshliq layout frame (vaqtinchalik o'lchov)</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    iframe {
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <pre id="tp-out" style="display:none"></pre>
  <script>
    // _tp_boss_probe_frame.html — iframe orqali ANIQ viewport o'lchamini beradi.
    // Bu sahifa Boshliq bo'limlarini o'lchash uchun (test infratuzilmasi).
    (function () {
      var P = new URLSearchParams(location.search);
      var W = +P.get('w'), H = +P.get('h');
      var q = P.get('q') || '';
      var out = document.getElementById('tp-out');
      var f = document.createElement('iframe');
      f.style.width = W + 'px';
      f.style.height = H + 'px';
      f.setAttribute('width', String(W));
      f.setAttribute('height', String(H));
      f.src = '_tp_boss_probe.html?' + q;
      document.body.appendChild(f);
      function collect() {
        try {
          var d = f.contentDocument;
          var el = d && d.getElementById('tp-out');
          if (el && el.textContent) { out.textContent = el.textContent; return true; }
        } catch (e) { /* cross-origin */ }
        return false;
      }
      var tries = 0;
      var iv = setInterval(function () {
        if (collect() || ++tries > 400) clearInterval(iv);
      }, 100);
    })();
  </script>
</body>

</html>
